<style>

        input[type=number]::-webkit-inner-spin-button,

<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex flex-col relative overflow-hidden ambient-glow">
<!-- Transactional Screen - Navigation Suppressed -->
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop w-full relative z-10">
<div class="w-full max-w-[420px] flex flex-col">
<!-- Brand Element -->
<div class="flex items-center gap-2 mb-12 justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1; font-size: 32px;">water_drop</span>
<span class="font-title-md text-title-md text-on-background tracking-tight">CareDrop</span>
</div>
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-3">
                    Verify your phone
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Enter the 6-digit code sent to <br>
<span class="font-title-md text-title-md text-on-surface mt-1 block">+1 234 *** 7890</span>
</p>
</div>
<!-- OTP Form -->
<form class="flex flex-col gap-8 w-full" id="otp-form">
<!-- Input Group -->
<div class="flex justify-between w-full gap-2 md:gap-3" id="otp-inputs">
<!-- Iterating 6 boxes for the code -->
<input autocomplete="one-time-code" class="w-12 h-14 sm:w-14 sm:h-16 bg-surface-container rounded-t-DEFAULT border-b-2 border-outline-variant text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]" required="" type="text">
<input class="w-12 h-14 sm:w-14 sm:h-16 bg-surface-container rounded-t-DEFAULT border-b-2 border-outline-variant text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]" required="" type="text">
<input class="w-12 h-14 sm:w-14 sm:h-16 bg-surface-container rounded-t-DEFAULT border-b-2 border-outline-variant text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]" required="" type="text">
<input class="w-12 h-14 sm:w-14 sm:h-16 bg-surface-container rounded-t-DEFAULT border-b-2 border-outline-variant text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]" required="" type="text">
<input class="w-12 h-14 sm:w-14 sm:h-16 bg-surface-container rounded-t-DEFAULT border-b-2 border-outline-variant text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]" required="" type="text">
<input class="w-12 h-14 sm:w-14 sm:h-16 bg-surface-container rounded-t-DEFAULT border-b-2 border-outline-variant text-center font-headline-lg-mobile text-headline-lg-mobile text-on-surface focus:border-primary focus:bg-surface-container-high focus:outline-none transition-colors shadow-sm" inputmode="numeric" maxlength="1" pattern="[0-9]" required="" type="text">
</div>
<!-- Primary CTA -->
<button class="w-full min-h-[48px] bg-primary-container hover:bg-primary-fixed text-on-primary-container font-label-md text-label-md uppercase tracking-wider rounded-lg flex items-center justify-center transition-all duration-200 shadow-[inset_0_1px_0_rgba(255,255,255,0.2)] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="submit">
                    Verify
                </button>
</form>
<!-- Resend Action -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">schedule</span>
                    Resend code in <span class="text-primary font-title-md text-title-md w-12 text-left" id="timer">0:59</span>
</p>
<button class="mt-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider hover:text-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed hidden" id="resend-btn" disabled="">
                    Resend Code
                </button>
</div>

</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-inputs input');
            const timerElement = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            const timerContainer = timerElement.parentElement;
            
            // Focus first input
            if(inputs.length > 0) {
                inputs[0].focus();
            }

            // OTP Input Logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    // Ensure only numbers
                    if (/[^0-9]/.test(val)) {
                        e.target.value = val.replace(/[^0-9]/g, '');
                        return;
                    }
                    
                    if (val.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Handle paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, inputs.length).replace(/[^0-9]/g, '');
                    if (pastedData) {
                        for (let i = 0; i < pastedData.length; i++) {
                            if (inputs[index + i]) {
                                inputs[index + i].value = pastedData[i];
                                if (index + i < inputs.length - 1) {
                                    inputs[index + i + 1].focus();
                                } else {
                                    inputs[index + i].blur();
                                }
                            }
                        }
                    }
                });
            });

            // Timer Logic
            let timeLeft = 59;
            const updateTimer = () => {
                if (timeLeft > 0) {
                    timerElement.textContent = `0:${timeLeft.toString().padStart(2, '0')}`;
                    timeLeft--;
                    setTimeout(updateTimer, 1000);
                } else {
                    timerContainer.classList.add('hidden');
                    resendBtn.classList.remove('hidden');
                    resendBtn.disabled = false;
                    resendBtn.classList.replace('text-on-surface-variant', 'text-primary');
                }
            };
            
            // Start timer
            setTimeout(updateTimer, 1000);
            
            // Form Submit (Visual only)
            document.getElementById('otp-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button[type="submit"]');
                const originalText = btn.textContent;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                btn.classList.add('opacity-90');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('opacity-90');
                    // In real app, handle success/fail here
                }, 1500);
            });
            
            // Resend Click
            resendBtn.addEventListener('click', () => {
                resendBtn.disabled = true;
                resendBtn.classList.add('hidden');
                timerContainer.classList.remove('hidden');
                timeLeft = 59;
                timerElement.textContent = `0:59`;
                setTimeout(updateTimer, 1000);
            });
        });
    </script>
</body></html>
