<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>CareDrop - Select Task Category</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-surface-variant": "#d3c4b1",
                      "outline": "#9c8f7e",

                      "secondary": "#5de6ff",

                      "tertiary-fixed": "#6ffbbe",
                      "surface-container-highest": "#353534",
                      "surface-container-low": "#1c1b1b",
                      "primary-fixed-dim": "#f5bd60",
                      "on-error-container": "#ffdad6",
                      "on-primary-fixed": "#281900",
                      "surface-container-lowest": "#0e0e0e",
                      "on-primary-container": "#583b00",
                      "tertiary": "#51e0a5",
                      "on-primary-fixed-variant": "#604100",
                      "surface-variant": "#353534",
                      "surface": "#131313",
                      "background": "#131313",
                      "on-background": "#e5e2e1",
                      "inverse-primary": "#7f5700",
                      "surface-tint": "#f5bd60",
                      "inverse-surface": "#e5e2e1",
                      "error-container": "#93000a",
                      "on-secondary": "#00363e",
                      "primary": "#f7bf62",
                      "on-tertiary-fixed": "#002113",
                      "on-tertiary": "#003824",
                      "on-surface": "#e5e2e1",
                      "secondary-fixed": "#a2eeff",
                      "secondary-container": "#00cbe6",
                      "on-tertiary-container": "#004b32",
                      "tertiary-container": "#29c48b",
                      "secondary-fixed-dim": "#2fd9f4",
                      "outline-variant": "#4f4537",
                      "surface-dim": "#131313",
                      "surface-bright": "#393939",
                      "on-primary": "#432c00",
                      "surface-container": "#201f1f",
                      "tertiary-fixed-dim": "#4edea3",
                      "on-secondary-fixed": "#001f25",
                      "inverse-on-surface": "#313030",
                      "error": "#ffb4ab",
                      "on-tertiary-fixed-variant": "#005236",
                      "on-error": "#690005",
                      "on-secondary-fixed-variant": "#004e5a"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-desktop": "32px",
                      "container-max": "1280px",
                      "margin-mobile": "16px",
                      "base": "8px",
                      "gutter": "16px"
              },
              "fontFamily": {
                      "label-md": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "headline-lg-mobile": [
                              "Inter"
                      ],
                      "display-lg": [
                              "Inter"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "title-md": [
                              "Inter"
                      ],
                      "headline-lg": [

                      ]
              },
              "fontSize": {
                      "label-md": [
                              "12px",
                              {
                                      "lineHeight": "16px",

                      ],
                      "body-md": [
                              "14px",

                      ],

                      "display-lg": [

                                      "fontWeight": "400"
                              }
                      ],
                      "title-md": [

                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.01em",

                      ]
              }
      },
          },
        }
      </script>
<style>
        body {
            background-color: #131313; /* surface */
            color: #e5e2e1; /* on-surface */
        }
        
        .task-card {
            background-color: #1E1E1E; /* surface-container slightly elevated */
            border: 1px solid #2C2C2C;
            transition: all 0.2s ease-in-out;
        }

        .task-card:hover {
            background-color: #2a2a2a; /* surface-container-high */
            border-color: #9c8f7e; /* outline */
            transform: translateY(-2px);
            box-shadow: 0 8px 24px 0 rgba(0,0,0,0.4);
        }
        
        .task-card:active {
            transform: scale(0.98);
        }

        .icon-container {
            background-color: #1c1b1b; /* surface-container-low */
            color: #f7bf62; /* primary */
        }
        
        .task-card:hover .icon-container {
            background-color: #d9a44a; /* primary-container */
            color: #583b00; /* on-primary-container */
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="bg-surface text-primary w-full top-0 sticky flat no shadows flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full z-50">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="text-on-surface-variant hover:text-primary transition-colors active:scale-95 duration-150 p-2 -ml-2 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">CareDrop</h1>
</div>
<div>
<!-- Trailing space empty for this flow -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8 md:py-12 pb-24">
<div class="mb-10 text-center md:text-left">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">What do you need help with?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select a category to begin your request.</p>
</div>
<!-- Bento Grid for Categories -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-gutter">
<!-- Card 1: Medicine Pickup -->
<button class="task-card rounded-xl p-6 flex flex-col items-start text-left w-full h-full group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="icon-container rounded-lg p-3 mb-4 transition-colors duration-200">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">medication</span>
</div>
<h3 class="font-title-md text-title-md text-on-surface mb-2">Medicine Pickup</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Collect prescribed medications from the pharmacy and deliver them.</p>
</button>
<!-- Card 2: Lab Report Collection -->
<button class="task-card rounded-xl p-6 flex flex-col items-start text-left w-full h-full group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="icon-container rounded-lg p-3 mb-4 transition-colors duration-200">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">biotech</span>
</div>
<h3 class="font-title-md text-title-md text-on-surface mb-2">Lab Report Collection</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Retrieve printed lab results or medical documents from the lab department.</p>
</button>
<!-- Card 3: Queue Assistance -->
<button class="task-card rounded-xl p-6 flex flex-col items-start text-left w-full h-full group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="icon-container rounded-lg p-3 mb-4 transition-colors duration-200">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">group</span>
</div>
<h3 class="font-title-md text-title-md text-on-surface mb-2">Queue Assistance</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Hold a place in line for appointments, billing, or administration.</p>
</button>
<!-- Card 4: Food Delivery -->
<button class="task-card rounded-xl p-6 flex flex-col items-start text-left w-full h-full group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="icon-container rounded-lg p-3 mb-4 transition-colors duration-200">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<h3 class="font-title-md text-title-md text-on-surface mb-2">Food Delivery</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Pick up meals or snacks from the cafeteria or external delivery points.</p>
</button>
<!-- Card 5: Essential Item Delivery -->
<button class="task-card rounded-xl p-6 flex flex-col items-start text-left w-full h-full group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="icon-container rounded-lg p-3 mb-4 transition-colors duration-200">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
</div>
<h3 class="font-title-md text-title-md text-on-surface mb-2">Essential Item Delivery</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Transport personal belongings, hygiene kits, or supplies to a ward.</p>
</button>
<!-- Card 6: Other Hospital Errand -->
<button class="task-card rounded-xl p-6 flex flex-col items-start text-left w-full h-full group focus:outline-none focus:ring-2 focus:ring-primary">
<div class="icon-container rounded-lg p-3 mb-4 transition-colors duration-200">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">more_horiz</span>
</div>
<h3 class="font-title-md text-title-md text-on-surface mb-2">Other Hospital Errand</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Describe a specific task or request not covered by the categories above.</p>
</button>
</div>
</main>
<!-- BottomNavBar Suppressed: Linear Flow / Task-Focused screen -->
</body></html>
