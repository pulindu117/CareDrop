<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131313; /* surface */
            color: #e5e2e1; /* on-surface */
            -webkit-font-smoothing: antialiased;
        }
        
        /* Material 3 Input Styles */
        .m3-input-container {
            position: relative;
            background-color: #181818; /* solid dark background per guidance */
            border-radius: 4px 4px 0 0;
            padding: 8px 16px 0;
            border-bottom: 1px solid #4f4537; /* outline-variant */
            transition: background-color 0.2s, border-bottom-color 0.2s;
        }
        
        .m3-input-container:hover {
            background-color: #201f1f; /* surface-container */
        }
        
        .m3-input-container:focus-within {
            border-bottom: 2px solid #f7bf62; /* primary accent highlight */
        }
        
        .m3-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #e5e2e1; /* on-surface */
            padding: 16px 0 8px;
            font-size: 16px;
            line-height: 24px;
            outline: none;
        }
        
        .m3-input::placeholder {
            color: transparent;
        }
        
        .m3-label {
            position: absolute;
            left: 16px;
            top: 16px;
            color: #d3c4b1; /* on-surface-variant */
            font-size: 16px;
            transition: all 0.2s ease-out;
            pointer-events: none;
        }
        
        .m3-input:focus ~ .m3-label,
        .m3-input:not(:placeholder-shown) ~ .m3-label {
            top: 4px;
            font-size: 12px;
            color: #f7bf62; /* primary */
        }
        
        .m3-input:not(:focus):not(:placeholder-shown) ~ .m3-label {
            color: #d3c4b1; /* on-surface-variant */
        }
        
        /* Step Progress Line */
        .step-line {
            height: 4px;
            background-color: #201f1f; /* surface-container */
            border-radius: 2px;
            overflow: hidden;
            flex-grow: 1;
            margin: 0 4px;
        }
        
        .step-line-active {
            height: 100%;
            background-color: #f7bf62; /* primary */
            width: 100%;
        }
        
        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #181818;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #353534; /* surface-variant */
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top App Bar (Suppressed via semantic shell mandate for transactional flow, but keeping a simple back header) -->
<header class="w-full max-w-[container-max] flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-surface sticky top-0 z-10">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-on-surface">New Request</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-3xl flex-grow flex flex-col px-margin-mobile md:px-margin-desktop py-6">
<!-- Progress Stepper (Step 1 of 6) -->
<div class="mb-8 w-full">
<div class="flex justify-between text-label-md font-label-md text-on-surface-variant mb-2 px-1">
<span>Task Details</span>
<span>Step 1 of 6</span>
</div>
<div class="flex items-center w-full">
<!-- Step 1 (Active) -->
<div class="step-line ml-0"><div class="step-line-active"></div></div>
<!-- Steps 2-6 (Inactive) -->
<div class="step-line"></div>
<div class="step-line"></div>
<div class="step-line"></div>
<div class="step-line"></div>
<div class="step-line mr-0"></div>
</div>
</div>
<!-- Task Intent Header -->
<div class="mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight mb-2">Medicine Pickup</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please provide the specifics for this pickup request.</p>
</div>
<!-- Form Card (Bento/Glassmorphism style approach per prompt request for high-end UI patterns) -->
<div class="bg-[#1E1E1E] rounded-xl border border-[#2C2C2C] p-6 shadow-[0_16px_24px_0_rgba(0,0,0,0.4)] flex-grow flex flex-col gap-6">
<!-- Medicine Name Input -->
<div class="m3-input-container">
<input class="m3-input font-body-lg text-body-lg" id="medicineName" placeholder=" " required="" type="text"/>
<label class="m3-label font-body-lg" for="medicineName">Medicine Name</label>
</div>
<!-- Quantity Input -->
<div class="m3-input-container">
<input class="m3-input font-body-lg text-body-lg" id="quantity" min="1" placeholder=" " required="" type="number"/>
<label class="m3-label font-body-lg" for="quantity">Quantity</label>
</div>
<!-- Dosage/Strength (Optional addition for context) -->
<div class="m3-input-container">
<input class="m3-input font-body-lg text-body-lg" id="dosage" placeholder=" " type="text"/>
<label class="m3-label font-body-lg" for="dosage">Dosage / Strength (Optional)</label>
</div>
<!-- Special Instructions Textarea -->
<div class="m3-input-container h-32 flex flex-col">
<textarea class="m3-input font-body-lg text-body-lg resize-none flex-grow" id="instructions" placeholder=" "></textarea>
<label class="m3-label font-body-lg" for="instructions">Special Instructions</label>
</div>
<div class="flex items-center gap-2 mt-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-label-md text-label-md text-on-surface-variant">Ensure exact spelling for controlled substances.</p>
</div>
</div>
<!-- Bottom Action Area -->
<div class="mt-8 mb-safe pb-8 w-full flex justify-end">
<button class="h-12 px-8 bg-primary-container text-on-primary-container font-title-md text-title-md rounded-full shadow-[0_4px_12px_0_rgba(0,0,0,0.4)] hover:bg-primary transition-colors active:scale-95 duration-150 relative overflow-hidden flex items-center gap-2 group">
<div class="absolute top-0 left-0 w-full h-[1px] bg-white opacity-10"></div> <!-- Glint -->
                Continue
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Simple vanilla JS for input handling if needed
        document.querySelectorAll('.m3-input').forEach(input => {
            input.addEventListener('blur', (e) => {
                if (e.target.value.trim() !== '') {
                    e.target.classList.add('has-value');
                } else {
                    e.target.classList.remove('has-value');
                }
            });
        });
    </script>
</body></html>
