<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        .role-card {
            transition: all 0.3s ease;
        }
        
        .role-card.selected {
            border-color: #f7bf62;
            background-color: rgba(247, 191, 98, 0.05);
        }
        
        .role-card.selected .selection-indicator {
            background-color: #f7bf62;
            border-color: #f7bf62;
        }
        
        .role-card.selected .selection-indicator span {
            opacity: 1;
            color: #432c00;
        }

        .role-card:hover:not(.selected) {
            border-color: #4f4537;
            background-color: #201f1f;
        }
    </style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" data-snapdom="injected-import"></head>
<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-surface w-full top-0 sticky shadow-sm z-50">
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop w-full h-16">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">CareDrop</span>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-8 md:py-16">
<div class="w-full max-w-[600px] flex flex-col gap-8">
<div class="text-center md:text-left space-y-2">
<h1 class="font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-on-surface">Select your role</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Choose how you want to use CareDrop today.</p>
</div>
<div class="flex flex-col gap-4">
<!-- Patient Card -->
<button class="role-card flex items-start text-left p-5 rounded-xl border border-surface-variant bg-[#1E1E1E] w-full focus:outline-none" onclick="selectRole(this)">
<div class="flex-shrink-0 mt-1 mr-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="personal_injury" data-weight="fill" style="font-variation-settings: 'FILL' 1;">personal_injury</span>
</div>
</div>
<div class="flex-grow pr-4">
<h3 class="font-title-md text-title-md text-on-surface mb-1">I am a Patient</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Someone needing help with hospital errands and logistics.</p>
</div>
<div class="flex-shrink-0 mt-2">
<div class="selection-indicator w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-sm opacity-0 transition-opacity" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
</button>
<!-- Guardian Card -->
<button class="role-card flex items-start text-left p-5 rounded-xl border border-surface-variant bg-[#1E1E1E] w-full focus:outline-none" onclick="selectRole(this)">
<div class="flex-shrink-0 mt-1 mr-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="family_restroom" data-weight="fill" style="font-variation-settings: 'FILL' 1;">family_restroom</span>
</div>
</div>
<div class="flex-grow pr-4">
<h3 class="font-title-md text-title-md text-on-surface mb-1">I am a Guardian</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Helping a loved one manage their hospital tasks and care.</p>
</div>
<div class="flex-shrink-0 mt-2">
<div class="selection-indicator w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-sm opacity-0 transition-opacity" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
</button>
<!-- Assistant Card -->
<button class="role-card flex items-start text-left p-5 rounded-xl border border-surface-variant bg-[#1E1E1E] w-full focus:outline-none" onclick="selectRole(this)">
<div class="flex-shrink-0 mt-1 mr-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-2xl" data-icon="volunteer_activism" data-weight="fill" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
</div>
</div>
<div class="flex-grow pr-4">
<h3 class="font-title-md text-title-md text-on-surface mb-1">I want to become a Community Assistant</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Providing help to patients and earning through logistics support.</p>
</div>
<div class="flex-shrink-0 mt-2">
<div class="selection-indicator w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-sm opacity-0 transition-opacity" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
</button>
</div>
<div class="mt-4">
<button class="w-full h-12 rounded-lg bg-surface-variant text-on-surface-variant font-title-md text-title-md flex items-center justify-center transition-all duration-300 opacity-50 cursor-not-allowed" disabled="" id="continue-btn">
                    Continue
                </button>
</div>
</div>
</main>
<script>
        function selectRole(element) {
            // Remove selected class from all cards
            const cards = document.querySelectorAll('.role-card');
            cards.forEach(card => card.classList.remove('selected'));
            
            // Add selected class to clicked card
            element.classList.add('selected');
            
            // Enable and style continue button
            const continueBtn = document.getElementById('continue-btn');
            continueBtn.disabled = false;
            continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
            continueBtn.classList.add('bg-primary-container', 'text-on-primary-container', 'hover:bg-primary', 'cursor-pointer', 'shadow-[inset_0_1px_0_0_rgba(255,255,255,0.1)]');
        }
    </script>
</body></html>
