<style>
        body { background-color: #121212; color: #e5e2e1; font-family: 'Inter', sans-serif; }

        @keyframes pulseCyan { 0% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); } }
    </style>

<body class="min-h-screen flex flex-col items-center antialiased">
<!-- TopAppBar -->
<header class="bg-surface w-full top-0 sticky flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full z-50">
<div class="flex items-center gap-4">
<div class="h-10 w-10 rounded-full overflow-hidden flex items-center justify-center bg-surface-container-high">
<img class="w-full h-full object-cover" data-alt="A close up professional headshot of a healthcare worker in a dimly lit, high tech hospital environment. Dark, corporate modern aesthetic. The lighting is calm and commanding, emphasizing reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCEnSpeEDlTnCPMtEi45dp4Se2NOnKrZBxCwlzlyrwHx-NBANWQL9wW3hFlEmlTM9T_nSnNzx56YrCblKnPszz9BoA6RfEZZ21OeZ1MfnIQEOXNtzXWj7UQCbZMTwfWBF0R2IT_nV621SVWpCT_RZgwZYv4-aqFHUh6En-mf4rOqgOssFsejQcDqwjdx7niYar8xIEmitAE9RxAr-a4ZYWFWukrH-bYFYCvyghUVM60_tkTLZZkyFCi">
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary tracking-tight">CareDrop</h1>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-md mx-auto flex flex-col justify-center px-margin-mobile py-12 md:py-24">
<div class="glass-card rounded-xl p-8 flex flex-col items-center text-center relative overflow-hidden">
<!-- Icon/Visual -->
<div class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center mb-6 relative">
<div class="absolute inset-0 rounded-full pulse-cyan border-2 border-secondary/30"></div>
<span class="material-symbols-outlined text-secondary text-4xl" data-icon="mark_email_unread" style="font-variation-settings: 'FILL' 1;">mark_email_unread</span>
</div>
<!-- Headers -->
<h2 class="font-title-md text-title-md text-on-surface mb-2">Check your email</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-6">
                We've sent a verification link to<br>
<span class="text-on-surface font-semibold">jane.smith@hospital.org</span>
</p>
<!-- Status Badge -->
<div class="inline-flex items-center gap-2 bg-surface-container-highest px-3 py-1.5 rounded-full mb-8">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-md text-label-md text-on-surface-variant">Awaiting verification</span>
</div>
<!-- Primary Action -->
<button class="w-full h-12 rounded-lg bg-primary-container text-on-primary-container font-label-md text-label-md flex items-center justify-center gap-2 amber-glint hover:bg-primary transition-colors active:scale-95 duration-150 mb-6">
                I've verified my email
            </button>
<!-- Secondary Actions -->
<div class="w-full flex flex-col items-center gap-4 border-t border-outline-variant/30 pt-6">
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">
                    Didn't receive the email?
                </p>
<button class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors disabled:opacity-50 disabled:cursor-not-allowed" id="resendBtn" disabled="">
                    Resend verification email <span id="countdown">(60s)</span>
</button>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors mt-2" href="#">
                    Change email address
                </a>
</div>
</div>
</main>
<script>
        // Simple countdown logic for visual demonstration
        let timeLeft = 60;
        const countdownEl = document.getElementById('countdown');
        const resendBtn = document.getElementById('resendBtn');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.textContent = '';
                resendBtn.disabled = false;
                resendBtn.classList.add('cursor-pointer');
            } else {
                countdownEl.textContent = `(${timeLeft}s)`;
            }
        }, 1000);
    </script>
</body></html>
