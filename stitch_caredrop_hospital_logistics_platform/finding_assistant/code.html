<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareDrop - Finding Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed": "#a2eeff",
                      "surface-dim": "#131313",
                      "surface-bright": "#393939",
                      "primary-fixed-dim": "#f5bd60",
                      "on-secondary-fixed": "#001f25",
                      "tertiary": "#51e0a5",
                      "inverse-on-surface": "#313030",
                      "primary-container": "#d9a44a",
                      "surface": "#131313",
                      "on-tertiary-container": "#004b32",
                      "on-tertiary": "#003824",
                      "on-error": "#690005",
                      "primary-fixed": "#ffdead",
                      "on-surface": "#e5e2e1",
                      "on-primary-fixed": "#281900",
                      "on-primary": "#432c00",
                      "on-primary-container": "#583b00",
                      "inverse-primary": "#7f5700",
                      "on-primary-fixed-variant": "#604100",
                      "tertiary-fixed-dim": "#4edea3",
                      "error": "#ffb4ab",
                      "secondary-fixed-dim": "#2fd9f4",
                      "on-secondary-fixed-variant": "#004e5a",
                      "background": "#131313",
                      "surface-container-highest": "#353534",
                      "primary": "#f7bf62",
                      "inverse-surface": "#e5e2e1",
                      "on-background": "#e5e2e1",
                      "on-secondary": "#00363e",
                      "outline": "#9c8f7e",
                      "on-secondary-container": "#00515d",
                      "surface-container": "#201f1f",
                      "tertiary-container": "#29c48b",
                      "error-container": "#93000a",
                      "surface-container-low": "#1c1b1b",
                      "secondary": "#5de6ff",
                      "surface-container-high": "#2a2a2a",
                      "secondary-container": "#00cbe6",
                      "tertiary-fixed": "#6ffbbe",
                      "surface-tint": "#f5bd60",
                      "outline-variant": "#4f4537",
                      "on-tertiary-fixed": "#002113",
                      "surface-container-lowest": "#0e0e0e",
                      "on-surface-variant": "#d3c4b1",
                      "on-tertiary-fixed-variant": "#005236",
                      "surface-variant": "#353534",
                      "on-error-container": "#ffdad6"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "margin-desktop": "32px",
                      "gutter": "16px",
                      "base": "8px",
                      "container-max": "1280px"
              },
              "fontFamily": {
                      "headline-lg": ["Inter"],
                      "label-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "title-md": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "body-md": ["Inter"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
        .radar-pulse {
            animation: radarPulse 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .radar-pulse-delay-1 {
            animation: radarPulse 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            animation-delay: 0.8s;
        }
        .radar-pulse-delay-2 {
            animation: radarPulse 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            animation-delay: 1.6s;
        }

        @keyframes radarPulse {
            0% {
                transform: scale(0);
                opacity: 0.8;
            }
            70% {
                transform: scale(3);
                opacity: 0;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }
        
        .map-overlay {
            background: radial-gradient(circle at center, transparent 0%, #131313 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Shell suppressed for this transactional view, but adding a simplified top bar for contextual grounding) -->
<header class="w-full top-0 fixed z-50 bg-surface/80 backdrop-blur-md">
<div class="flex justify-center items-center px-margin-mobile md:px-margin-desktop h-16 w-full max-w-[1280px] mx-auto">
<div class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">CareDrop</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow relative overflow-hidden flex flex-col justify-end w-full h-[100dvh]">
<!-- Map Background with location data -->
<div class="absolute inset-0 w-full h-full z-0">
<img class="w-full h-full object-cover opacity-60" data-alt="A dark mode, high contrast minimalist digital map of a city grid. The streets are represented by thin, subtle dark grey lines (#2C2C2C) against a deep charcoal background (#131313). No labels, minimal distractions, optimized for a sleek, modern, professional healthcare logistics interface. Soft lighting, calm aesthetic." data-location="New York City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAirDfBIXGUs475Tj0IeUriSiU72zo5GdVTKdDy26sh-M-puuNNADLmEDwA_2-2Hcga0vpGbyVAKJnLAgrvkbPfD5qewlmWE5r4AAsQiWf9PbT78o5lV6mgnOIJDZg66VtzeshvGjOEBMtGIiyCsLm2-avnGF2e6sEvHwsSXd3nJUQTtbTXSZRxS8aXGfc3KTK-Jdw_xujuytFmD6uyig1gC2PWPoXMoO06oGKerf-LU9PSHqkH5IqE"/>
<!-- Subtle vignette overlay -->
<div class="absolute inset-0 map-overlay opacity-80 pointer-events-none"></div>
</div>
<!-- Radar Animation Area -->
<div class="absolute inset-0 z-10 flex items-center justify-center pointer-events-none">
<div class="relative flex items-center justify-center">
<!-- Center point -->
<div class="w-4 h-4 bg-primary rounded-full absolute z-20 shadow-[0_0_12px_rgba(217,164,74,0.8)]"></div>
<!-- Pulsing Rings -->
<div class="w-24 h-24 border-2 border-primary/40 rounded-full absolute radar-pulse"></div>
<div class="w-24 h-24 border-2 border-primary/30 rounded-full absolute radar-pulse-delay-1"></div>
<div class="w-24 h-24 border-2 border-primary/20 rounded-full absolute radar-pulse-delay-2"></div>
</div>
<!-- Searching Text Overlay -->
<div class="absolute top-[25%] left-0 w-full text-center px-6">
<h1 class="font-title-md text-title-md text-on-surface mb-2">Finding nearby Community Assistants...</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">Broadcasting request to available assistants in your area.</p>
</div>
</div>
<!-- Bottom Action Card -->
<div class="relative z-20 w-full px-margin-mobile md:px-margin-desktop pb-8 max-w-md mx-auto">
<div class="bg-surface-container-high rounded-xl border border-surface-variant shadow-[0_-4px_24px_0_rgba(0,0,0,0.4)] overflow-hidden flex flex-col">
<!-- Loading Progress Bar -->
<div class="w-full h-1 bg-surface-container">
<div class="h-full bg-primary w-1/3 animate-[pulse_2s_ease-in-out_infinite]" style="animation: slideRight 3s linear infinite;"></div>
</div>
<style>
                    @keyframes slideRight {
                        0% { width: 0; margin-left: 0; }
                        50% { width: 30%; margin-left: 70%; }
                        100% { width: 0; margin-left: 100%; }
                    }
                </style>
<div class="p-6 flex flex-col gap-6">
<!-- Task Summary -->
<div class="flex items-start gap-4">
<div class="w-12 h-12 bg-surface-container flex items-center justify-center rounded-lg border border-surface-variant flex-shrink-0">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-1">Requesting</span>
<span class="font-title-md text-title-md text-on-surface">Pharmacy Pickup</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                                City General Hospital, Rm 402
                            </span>
</div>
</div>
<!-- Cancel Action -->
<button class="w-full h-12 min-h-[48px] bg-transparent border border-outline-variant hover:border-error hover:bg-error/10 text-on-surface hover:text-error rounded-lg font-body-lg text-body-lg transition-colors flex items-center justify-center gap-2 active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">close</span>
                        Cancel Request
                    </button>
</div>
</div>
</div>
</main>
</body></html>
