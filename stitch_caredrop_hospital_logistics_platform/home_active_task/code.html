            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;

<body class="antialiased min-h-screen flex flex-col pb-24">

<div>
<p class="font-body-md text-body-md text-on-surface-variant">Greeting</p>
<h1 class="font-title-md text-title-md text-primary tracking-tight">Hello, Dr. Jane</h1>
</div>
</div>
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full w-12 h-12 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<main class="flex-grow px-margin-mobile flex flex-col gap-8 mt-4 md:px-margin-desktop md:max-w-container-max md:mx-auto w-full">
<!-- Active Task -->
<section class="flex flex-col gap-4">
<h2 class="font-title-md text-title-md text-on-surface">Active Task</h2>
<div class="bg-[#1E1E1E] rounded-xl border border-[#2C2C2C] p-4 flex flex-col gap-4 relative overflow-hidden">
<!-- Subtle glow effect -->
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary opacity-10 rounded-full blur-2xl -mr-16 -mt-16 pointer-events-none"></div>
<div class="flex justify-between items-start">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-secondary-container bg-opacity-20 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">local_pharmacy</span>
</div>
<div>
<h3 class="font-title-md text-title-md text-on-surface">Medicine Pickup</h3>
<p class="font-body-md text-body-md text-secondary flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
                                On the way
                            </p>
</div>
</div>
</div>
<div class="flex justify-between items-end mt-2">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-highest">
<img alt="Assistant Marcus Lee" class="w-full h-full object-cover" data-alt="A close-up headshot of a male hospital logistics assistant named Marcus Lee. He is wearing a dark, professional uniform with a subtle ID badge visible. His expression is focused and capable. The lighting is low-key, illuminating his face against a dark, moody background, consistent with a high-stakes, corporate modern healthcare setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9Z42rbHC0iBijWcW-mnchWDZ4iODRV-xssYOVc6xYkmNsKaU1apQvMWGIxYldFAgLRqMRxiqICfOYTbfG8FzdcGtNPzr8cK7w426ji7cSPy6eN2WEAwrmCSE0gRWH0sYyddX8ufm5yAjGUVia3-IljWzGIJRAAE_kfvhiLsmzU7ajqllXPJSMusv0qjV3jnW2H7vJ8ly9NRrFPyM1u0bbNggQEz0rOXANkSf0ywDifXJSjexxYaYL">
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant">Assistant</span>
<span class="font-body-md text-body-md text-on-surface">Marcus Lee</span>
</div>
</div>
<button class="bg-primary-container text-on-primary-container font-label-md text-label-md px-6 py-3 rounded-lg flex items-center gap-2 min-h-[48px] active:scale-95 transition-transform relative overflow-hidden group">
<div class="absolute inset-x-0 top-0 h-[1px] bg-white opacity-10"></div>
                        Track
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</section>
<!-- Categories -->
<section class="flex flex-col gap-4">
<h2 class="font-title-md text-title-md text-on-surface">Categories</h2>
<div class="grid grid-cols-2 md:grid-cols-3 gap-4">
<button class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high transition-colors active:scale-95 min-h-[100px]">
<span class="material-symbols-outlined text-tertiary text-3xl">medication</span>
<span class="font-body-md text-body-md text-on-surface text-center">Medicine Pickup</span>
</button>
<button class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high transition-colors active:scale-95 min-h-[100px]">
<span class="material-symbols-outlined text-primary text-3xl">science</span>
<span class="font-body-md text-body-md text-on-surface text-center">Lab Reports</span>
</button>
<button class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high transition-colors active:scale-95 min-h-[100px]">
<span class="material-symbols-outlined text-secondary text-3xl">group</span>
<span class="font-body-md text-body-md text-on-surface text-center">Queue Assistance</span>
</button>
<button class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high transition-colors active:scale-95 min-h-[100px]">
<span class="material-symbols-outlined text-[#F43F5E] text-3xl">restaurant</span>
<span class="font-body-md text-body-md text-on-surface text-center">Food Delivery</span>
</button>
<button class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high transition-colors active:scale-95 min-h-[100px]">
<span class="material-symbols-outlined text-[#A855F7] text-3xl">inventory_2</span>
<span class="font-body-md text-body-md text-on-surface text-center">Items</span>

<button class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-high transition-colors active:scale-95 min-h-[100px]">
<span class="material-symbols-outlined text-on-surface-variant text-3xl">apps</span>
<span class="font-body-md text-body-md text-on-surface text-center">Others</span>
</button>
</div>
</section>
<!-- Recent Requests -->
<section class="flex flex-col gap-4 mb-8">
<div class="flex justify-between items-center">
<h2 class="font-title-md text-title-md text-on-surface">Recent Requests</h2>
<button class="font-label-md text-label-md text-primary hover:underline">View All</button>
</div>
<div class="flex flex-col gap-2">
<div class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-4 flex justify-between items-center min-h-[64px] hover:bg-surface-container-high cursor-pointer transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">science</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Blood Test Results</span>
<span class="font-label-md text-label-md text-on-surface-variant">Today, 10:30 AM</span>
</div>
</div>
<span class="font-label-md text-label-md text-tertiary bg-tertiary-container bg-opacity-20 px-2 py-1 rounded">Completed</span>
</div>
<div class="bg-[#1E1E1E] border border-[#2C2C2C] rounded-xl p-4 flex justify-between items-center min-h-[64px] hover:bg-surface-container-high cursor-pointer transition-colors">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">restaurant</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Dietary Meal Delivery</span>
<span class="font-label-md text-label-md text-on-surface-variant">Yesterday, 1:15 PM</span>
</div>
</div>
<span class="font-label-md text-label-md text-tertiary bg-tertiary-container bg-opacity-20 px-2 py-1 rounded">Completed</span>
</div>
</div>
</section>
</main>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-2 py-3 bg-surface-container-low z-50 md:hidden rounded-t-xl shadow-[0_-4px_24px_0_rgba(0,0,0,0.4)]">

<span class="material-symbols-outlined text-[28px] mb-0.5">add_circle</span>
<span class="font-label-md text-label-md">Create</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200 p-2">
<span class="material-symbols-outlined mb-1">chat_bubble</span>
<span class="font-label-md text-label-md">Messages</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200 p-2">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>
