<div class="space-y-2">

</div>
<input class="w-full bg-[#181818] border-0 border-b-2 border-surface-variant text-on-surface pl-10 pr-4 py-4 rounded-t-DEFAULT focus:ring-0 focus:border-primary input-glow font-body-md transition-colors" id="email" name="email" placeholder="name@hospital.org" required="" type="email">
</div>
</div>
